<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <meta name="description" content="Póngase en contacto con Transporte JGT y Timol para consultas, cotizaciones y servicios logísticos en Añelo, Cipolletti y la región de Vaca Muerta.">
    <link rel="canonical" href="https://www.transporte-jgt.com/contacto/" />
    <link rel="icon" type="image/x-icon" href="../icons/jgt-2.webp">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" as="style">
    <link rel="stylesheet" href="../css/main.css">

    <!-- Open Graph -->
    <meta property="og:title" content="Contacto | Transporte JGT y Timol">
    <meta property="og:description" content="Consultá, pedí una cotización o comunicate con nuestro equipo en Añelo, Cipolletti y la región de Vaca Muerta.">
    <meta property="og:image" content="https://www.transporte-jgt.com/img/equipos.jpg">
    <meta property="og:url" content="https://www.transporte-jgt.com/contacto/">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contacto | Transporte JGT y Timol">
    <meta name="twitter:description" content="Consultá, pedí una cotización o comunicate con nuestro equipo en Añelo, Cipolletti y la región de Vaca Muerta.">
    <meta name="twitter:image" content="https://www.transporte-jgt.com/img/equipos.jpg">
</head>
<body>
    <!-- Header -->
     <div data-include="../templates/header.html"></div> 
 <main id="main-content" role="main">
            <h1 class="main-title">Contacto</h1>

        <section class="contact-section">
            <div class="contact-wrapper">
                <!-- Contact Form -->
                <div class="contact-form-container">
                    <h2>Envíenos un mensaje</h2>
                    <p class="contact-lead">Complete el formulario y le responderemos a la brevedad.</p>
                    <form id="contact-form" action="https://formsubmit.co/ptarifa@timolsrl.com" method="POST">
                        <input type="hidden" name="_template" value="basic">
                        <input type="text" name="_honey" style="display:none">
                        <div class="form-group">
                            <label for="name">Nombre / Empresa</label>
                            <input type="text" id="name" name="Nombre/Empresa" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" name="Correo" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Teléfono <span class="form-optional">(Opcional)</span></label>
                            <input type="tel" id="phone" name="Teléfono">
                        </div>
                        <div class="form-group">
                            <label for="message">Mensaje</label>
                            <textarea id="message" name="Mensaje" rows="7" placeholder="Escriba su consulta aquí..." required></textarea>
                        </div>
                        <input type="hidden" name="_next" value="/gracias/">
                        <input type="hidden" name="_replyto" id="_replyto">
                        <button type="submit" class="cta-button">Enviar Mensaje</button>
                        <p id="form-status" role="alert" aria-live="polite"></p>
                    </form>
                </div>

                <!-- Contact Info -->
                <div class="contact-info-container">
                    <h2>Contacto directo</h2>
                    <p class="contact-lead">Comuníquese directamente con nuestros referentes.</p>

                    <div class="contact-person">
                        <p class="contact-person-name">Juan Gabriel Tarifa</p>
                        <p class="contact-person-email">juangabrieltarifa[at]hotmail.com</p>
                    </div>

                    <div class="contact-person">
                        <p class="contact-person-name">Gabriel Alejandro Morales</p>
                        <p class="contact-person-email">gmorales[at]timolsrl.com</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div data-include="../templates/footer.html"></div>
    <script src="../js/include.js" defer></script>
    <script src="../js/script.js" defer></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', function() {
            document.getElementById('_replyto').value = document.getElementById('email').value;
        });
    </script>

</body>
</html>
